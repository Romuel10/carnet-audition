services:
  - type: web
    name: assistant-pv-transcription-relay
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_SHARED_SECRET
        sync: false
      - key: OPENAI_LIVE_MODEL
        value: gpt-live-transcribe
      - key: OPENAI_LIVE_DELAY
        value: low
      - key: OPENAI_FINAL_MODEL
        value: gpt-transcribe
      - key: OPENAI_FINAL_REFINEMENT
        value: "true"
